name: gheymatyar

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gheymatyar
      POSTGRES_USER: gheymatyar
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gheymatyar -d gheymatyar"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: gheymatyar
      MINIO_ROOT_PASSWORD: local-development-only
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  minio-init:
    image: docker.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    environment:
      MINIO_ROOT_USER: gheymatyar
      MINIO_ROOT_PASSWORD: local-development-only
      S3_BUCKET: gheymatyar-source-documents
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c '
      /usr/bin/mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
      /usr/bin/mc mb --ignore-existing "local/$${S3_BUCKET}" &&
      /usr/bin/mc anonymous set none "local/$${S3_BUCKET}"
      '
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      APP_NAME: Gheymatyar API
      LOG_LEVEL: INFO
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql+asyncpg://gheymatyar:local-development-only@postgres:5432/gheymatyar
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: gheymatyar-source-documents
      S3_ACCESS_KEY: gheymatyar
      S3_SECRET_KEY: local-development-only
      S3_REGION: us-east-1
      S3_CONNECT_TIMEOUT_SECONDS: 3
      S3_READ_TIMEOUT_SECONDS: 10
      AUTH_PUBLIC_REGISTRATION_ENABLED: "true"
      AUTH_COOKIE_SECURE: "false"
      AUTH_SESSION_TTL_SECONDS: 604800
      AUTH_LOGIN_MAX_FAILURES: 5
      AUTH_LOGIN_WINDOW_SECONDS: 900
      MAX_UPLOAD_BYTES: 10485760
      MAX_WORKBOOK_HEADER_SCAN_ROWS: 20
      MAX_WORKBOOK_ROWS: 50000
      MAX_WORKBOOK_COLUMNS: 200
      MAX_WORKBOOK_SHEETS: 20
      MAX_XLSX_ARCHIVE_ENTRIES: 10000
      MAX_XLSX_UNCOMPRESSED_BYTES: 104857600
      MAX_XLSX_COMPRESSION_RATIO: 250
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
