name: gheymatyar

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gheymatyar
      POSTGRES_USER: gheymatyar
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gheymatyar -d gheymatyar"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: gheymatyar
      MINIO_ROOT_PASSWORD: local-development-only
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: development
      APP_NAME: Gheymatyar API
      LOG_LEVEL: INFO
      WEB_ORIGIN: http://localhost:3000
      MAX_UPLOAD_BYTES: 10485760
      MAX_WORKBOOK_HEADER_SCAN_ROWS: 20
      MAX_WORKBOOK_ROWS: 50000
      MAX_WORKBOOK_COLUMNS: 200
      MAX_WORKBOOK_SHEETS: 20
      MAX_XLSX_ARCHIVE_ENTRIES: 10000
      MAX_XLSX_UNCOMPRESSED_BYTES: 104857600
      MAX_XLSX_COMPRESSION_RATIO: 250
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
