[project]
name = "gheymatyar-api"
version = "0.1.0"
description = "Backend API for trustworthy wholesale supplier price-list comparison."
readme = "../../README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116.1,<1",
  "openpyxl>=3.1.5,<4",
  "pydantic-settings>=2.10.1,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1",
  "mypy>=1.17.1,<2",
  "pytest>=8.4.1,<10",
  "pytest-cov>=6.2.1,<7",
  "ruff>=0.12.10,<1",
  "types-openpyxl>=3.1.5.20250822",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=app --cov-report=term-missing"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/unit/test_normalization.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true
