name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gheymatyar
          POSTGRES_USER: gheymatyar
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gheymatyar -d gheymatyar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://gheymatyar:ci-only-password@localhost:5432/gheymatyar
      S3_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: gheymatyar-source-documents-ci
      S3_ACCESS_KEY: gheymatyar-ci
      S3_SECRET_KEY: ci-only-minio-password
      S3_REGION: us-east-1
      RUN_OBJECT_STORAGE_INTEGRATION: "1"
      TEST_S3_ENDPOINT_URL: http://localhost:9000
      TEST_S3_BUCKET: gheymatyar-source-documents-ci
      TEST_S3_ACCESS_KEY: gheymatyar-ci
      TEST_S3_SECRET_KEY: ci-only-minio-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --dev
      - name: Start private MinIO test service
        run: |
          docker run --detach --rm --name gheymatyar-ci-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER="$S3_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:9000/minio/health/live >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "MinIO did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh \
            --env S3_ACCESS_KEY="$S3_ACCESS_KEY" \
            --env S3_SECRET_KEY="$S3_SECRET_KEY" \
            --env S3_BUCKET="$S3_BUCKET" \
            docker.io/minio/mc:RELEASE.2025-08-13T08-35-41Z -c '
              mc alias set local http://localhost:9000 "$S3_ACCESS_KEY" "$S3_SECRET_KEY" &&
              mc mb --ignore-existing "local/$S3_BUCKET" &&
              mc anonymous set none "local/$S3_BUCKET"
            '
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run ruff format --check app tests
      - run: uv run ruff check app tests
      - run: uv run mypy app
      - run: uv run pytest

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend format:check
      - run: pnpm --dir frontend build
